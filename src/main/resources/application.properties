spring.application.name=anime-ai
server.port=8094

# UTF-8 encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true


# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ykd_anime_ai?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=single
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.format_sql=true

# DeepSeek (main chat)
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
spring.ai.openai.chat.options.model=deepseek-v4-pro
spring.ai.openai.chat.options.temperature=0.3

# DashScope Vision
ilink.llm.vision.api-key=${DASHSCOPE_API_KEY}
ilink.llm.vision.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
ilink.llm.vision.model=qwen-vl-max

# DashScope Embedding
ilink.llm.embedding.api-key=${DASHSCOPE_API_KEY}
ilink.llm.embedding.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
ilink.llm.embedding-model=text-embedding-v2

# Legacy LLM config
ilink.llm.api-key=${DEEPSEEK_API_KEY}
ilink.llm.base-url=https://api.deepseek.com/v1
ilink.llm.model=deepseek-v4-pro

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chat memory
chat.memory.max-messages=10
chat.memory.max-tokens=2000
chat.memory.summary-threshold=3000
chat.memory.summary-keep-recent=5

# Weather
weather.api.base-url=https://api.seniverse.com/v3/weather/daily.json
weather.api.api-key=${SENIVERSE_API_KEY}
weather.api.connect-timeout=5000
weather.api.read-timeout=10000

# Amap
amap.api-key=${AMAP_API_KEY}
amap.base-url=https://restapi.amap.com/v3

# Xunfei TTS
xunfei.tts.app-id=${XUNFEI_APP_ID}
xunfei.tts.api-key=${XUNFEI_API_KEY}
xunfei.tts.api-secret=${XUNFEI_API_SECRET}
xunfei.tts.vcn=xiaoyan
xunfei.tts.aue=lame

# Disable Redis
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

spring.main.allow-bean-definition-overriding=true
# Disable SQLite
spring.datasource.secondary.url=

spring.web.resources.static-locations=classpath:/static/

# Anime LLM (for tool calling)
anime.llm.api-key=${DEEPSEEK_API_KEY}
anime.llm.base-url=https://api.deepseek.com/v1
anime.llm.model=deepseek-v4-pro

