        #toast{position:fixed;right:25px;bottom:25px;background:rgba(30,60,40,.92);color:#e8f5e9;padding:12px 20px;border-radius:12px;display:none;z-index:10;backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(30,60,40,.2);animation:textReveal .3s ease-out}

<body>
<div class="sky-scene" style="position:fixed;pointer-events:none;opacity:.35"><div class="sun-flare" style="width:50vw;height:50vw;right:-5vw;top:-10vw;opacity:.6"></div><div class="god-rays"></div><div class="cloud c1" style="opacity:.4"></div><div class="cloud c2" style="opacity:.35"></div><div class="cloud c3" style="opacity:.25"></div><div class="rain" style="opacity:.06"></div><div class="sparkles" style="opacity:.18"></div><div class="petals"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div></div><div class="rainbow"></div><div class="moon"></div><div class="stars-s1"></div><div class="stars-s2"></div><div class="stars-s3"></div><div class="lightning"></div><div class="fog"></div><div class="raindrops"><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div><div class="raindrop"></div></div><div class="cloud-puffs"><div class="cloud-puff"></div><div class="cloud-puff"></div><div class="cloud-puff"></div><div class="cloud-puff"></div><div class="cloud-puff"></div><div class="cloud-puff"></div><div class="cloud-puff"></div><div class="cloud-puff"></div><div class="cloud-puff"></div><div class="cloud-puff"></div></div><div class="snowfall"><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div></div><div class="fireflies"><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div><div class="firefly"></div></div></div>
<header>
    <h2>🌿🐾 AI 护理助手</h2>
    <div class="tabs">
        <button id="plantTab" class="active" onclick="switchType('PLANT')">植物护理</button>

<main>
    <section class="hero">
        <div><h1 id="heroTitle">让每一株植物都被科学照�?/h1><p id="heroDesc">上传照片进行 AI 识别和状态诊断，建立专属档案，持续记录浇水、施肥与生长情况。助手会结合真实护理历史回答问题�?/p></div>
        <label class="upload" id="uploadBox"><input id="imageFile" type="file" accept="image/*" onchange="recognize(this.files[0])"><div><div style="font-size:38px">📷</div><strong id="uploadText">上传植物照片</strong><span class="muted">支持 JPG、PNG，识别后可保存档�?/span></div></label>
    </section>
    <div class="grid">
        <section class="panel">
            <h3>AI 识别与诊�?/h3>
            <div id="emptyResult" class="muted">请先上传照片，识别结果会显示在这里�?/div>
            <div id="aiResult" style="display:none">
                <div class="result" id="resultText"></div>
                <h4 style="font-family:'Noto Serif SC';margin:16px 0 8px;color:#2d5a3f">保存为档�?/h4>
                <input id="targetName" placeholder="给它取个名字">
                <input id="species" placeholder="物种/品种">
                <input id="breed" placeholder="细分品种（仅宠物�? style="display:none">

<div id="toast"></div>
<script>
let type='PLANT', imageData='', diagnosis='', lastReply='', lastTargetName='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/auth/me').then(r=>r.json()).then(x=>{if(x.code!==200)location.href='/login';else userName.textContent=x.data.userName});
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function switchType(t){type=t;plantTab.classList.toggle('active',t==='PLANT');petTab.classList.toggle('active',t==='PET');heroTitle.textContent=t==='PLANT'?'让每一株植物都被科学照�?:'让每一只宠物都获得贴心守护';heroDesc.textContent=t==='PLANT'?'上传照片进行 AI 识别和状态诊断，建立专属档案，持续记录浇水、施肥与生长情况�?:'上传宠物照片识别种类和外观健康状态，建立档案，持续记录喂养、驱虫、疫苗与就医情况�?;uploadText.textContent='上传'+(t==='PLANT'?'植物':'宠物')+'照片';archiveTitle.textContent='我的'+(t==='PLANT'?'植物':'宠物')+'档案';breed.style.display=t==='PET'?'block':'none';aiResult.style.display='none';emptyResult.style.display='block';loadTargets()}
function recognize(file){if(!file)return;const reader=new FileReader();reader.onload=async e=>{imageData=e.target.result;uploadBox.classList.add('loading');try{const r=await fetch('/api/care/identify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,image:imageData.split(',')[1]})});if(!r.ok)throw Error('识别失败');const x=await r.json();diagnosis=x.data.result;resultText.textContent=diagnosis;emptyResult.style.display='none';aiResult.style.display='block';species.value=extractSpecies(diagnosis)}catch(e){toast(e.message)}finally{uploadBox.classList.remove('loading')}};reader.readAsDataURL(file)}
function extractSpecies(s){const m=s.match(/(?:品种|物种|名称)[�?]\s*([^\n，。]+)/);return m?m[1].replace(/\*\*/g,'').trim():''}
async function saveTarget(){if(!targetName.value.trim())return toast('请填写档案名�?);const body={name:targetName.value.trim(),species:species.value.trim(),breed:breed.value.trim(),imageUrl:imageData?'data:image/uploaded':''};const r=await fetch('/api/care/targets/'+type,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return toast('保存失败');targetName.value='';toast('档案已保�?);loadTargets()}
async function loadTargets(){const r=await fetch('/api/care/targets/'+type);if(r.status===401)return location.href='/login';const x=await r.json();const rows=x.data;targets.innerHTML=rows.length?rows.map(cardHtml).join(''):'<div class="muted">还没有档案，上传照片识别或直接创建一个吧�?/div>';updateTargetSelect(rows)}
function cardHtml(x){return `<article class="card"><h4>${type==='PLANT'?'🌱':'🐾'} ${esc(x.name)}</h4><div class="muted">${esc(x.species||'未填写品�?)}${x.breed?' · '+esc(x.breed):''}</div><div class="actions"><button class="minor" onclick="showRecords(${x.id},this)">护理记录</button><button class="minor" onclick="addRecord(${x.id})">新增记录</button><button class="danger" onclick="removeTarget(${x.id})">删除</button></div><div class="records" id="records-${x.id}" style="display:none"></div></article>`}
async function showRecords(id,btn){const box=document.getElementById('records-'+id);if(box.style.display!=='none'){box.style.display='none';return}const r=await fetch(`/api/care/records/${type}/${id}`);const x=await r.json();const rows=x.data;box.innerHTML=rows.length?rows.map(x=>`<div class="record"><b>${esc(x.recordType||'护理')}</b> · ${esc(x.content||'')}<div class="muted">${esc(x.createdAt||'')}</div></div>`).join(''):'<div class="muted">暂无护理记录</div>';box.style.display='block'}
async function addRecord(id){const recordType=prompt(type==='PLANT'?'记录类型：浇�?施肥/修剪/换盆':'记录类型：喂�?洗护/驱虫/疫苗/就医');if(!recordType)return;const content=prompt('记录详情');if(content===null)return;await fetch('/api/care/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({targetType:type,targetId:id,recordType,content})});toast('护理记录已保�?);const box=document.getElementById('records-'+id);box.style.display='none';showRecords(id)}
async function removeTarget(id){if(!confirm('确定删除档案及其护理记录�?))return;await fetch(`/api/care/targets/${type}/${id}`,{method:'DELETE'});loadTargets()}
function updateTargetSelect(rows){const sel=document.getElementById('targetSelect');sel.innerHTML='<option value="">选择一个档案（可选）</option>';rows.forEach(x=>{const opt=document.createElement('option');opt.value=x.id;opt.textContent=x.name+(x.species?' - '+x.species:'');sel.appendChild(opt)});qaSummary.style.display='none';summaryBtnContainer.style.display='none'}
function onTargetChange(){qaSummary.style.display='none';summaryBtnContainer.style.display='none'}
async function askAI(){const q=question.value.trim();if(!q)return toast('请输入护理问�?);qaResult.style.display='block';qaResult.textContent='AI正在分析中�?;qaSummary.style.display='none';summaryBtnContainer.style.display='none';const targetSelect=document.getElementById('targetSelect');const targetId=targetSelect.value?parseInt(targetSelect.value):null;const r=await fetch('/api/care/qa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,targetType:type,targetId:targetId})});const x=await r.json();qaResult.textContent=x.data.reply||'暂时无法回答';lastReply=x.data.reply||'';lastTargetName=x.data.targetName||'';if(lastReply){summaryBtnContainer.style.display='block';qaSummary.style.display='none'}}
async function generateSummary(){if(!lastReply)return toast('请先提问获取护理建议');qaSummary.style.display='block';summaryText.textContent='AI正在生成摘要�?;const r=await fetch('/api/care/qa/summary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reply:lastReply,targetType:type,targetName:lastTargetName})});const x=await r.json();summaryText.textContent=x.data.summary||'无法生成摘要'}
async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login'}
loadTargets();
</script>
